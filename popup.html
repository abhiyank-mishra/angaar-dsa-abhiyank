<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Angaar Pro</title>
  <style>
    :root {
      --theme-accent: #EF4444;
      --theme-accent-hover: #B91C1C;
      --theme-accent-subtle: rgba(239, 68, 68, 0.14);
      --theme-accent-border: rgba(239, 68, 68, 0.35);
      --theme-bg: #000000;
      --theme-surface: #121212;
      --theme-surface-elevated: #181818;
      --theme-border: #202020;
      --theme-text: #FFFFFF;
      --theme-text-muted: #B3B3B3;
      --theme-text-subtle: #737373;
      --theme-success: #10B981;
      --theme-success-subtle: rgba(16, 185, 129, 0.12);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 16px;
      width: 270px;
      background: var(--theme-bg);
      color: var(--theme-text);
      font-family: var(--font-sans);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--theme-border);
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--theme-text);
      white-space: nowrap;
      letter-spacing: -0.2px;
    }

    .badge {
      font-size: 10px;
      padding: 2px 6px;
      background: var(--theme-success-subtle);
      color: var(--theme-success);
      border: 1px solid rgba(34, 197, 94, 0.25);
      border-radius: var(--radius-sm);
      font-weight: 500;
      white-space: nowrap;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      text-align: left;
      white-space: nowrap;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      user-select: none;
      box-sizing: border-box;
    }

    .btn-primary {
      background: var(--theme-accent);
      color: #ffffff;
      border-color: var(--theme-accent);
    }

    .btn-primary:hover {
      background: var(--theme-accent-hover);
      border-color: var(--theme-accent-hover);
    }

    .btn-secondary {
      background: var(--theme-surface);
      color: var(--theme-text-muted);
      border-color: var(--theme-border);
    }

    .btn-secondary:hover {
      background: var(--theme-surface-elevated);
      color: var(--theme-text);
      border-color: var(--theme-accent-border);
    }

    .footer {
      margin-top: 14px;
      font-size: 11px;
      color: var(--theme-text-subtle);
      text-align: center;
      border-top: 1px solid var(--theme-border);
      padding-top: 10px;
      white-space: nowrap;
    }
    .shield-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      margin-bottom: 12px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: var(--radius-sm);
      font-size: 11px;
    }

    .shield-title {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #e2e8f0;
      font-weight: 500;
    }

    .shield-dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 6px #10b981;
    }

    .shield-badge {
      font-size: 10px;
      font-weight: 600;
      color: #10b981;
      background: rgba(16, 185, 129, 0.15);
      padding: 1px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-wrap">
      <h1>Angaar Pro</h1>
    </div>
    <span class="badge">Active</span>
  </div>

  <div class="shield-banner">
    <div class="shield-title">
      <span class="shield-dot"></span>
      <span>Admin Contest Shield</span>
    </div>
    <span class="shield-badge">0 Flags</span>
  </div>

  <div class="btn-group">
    <button class="btn btn-primary" id="openChecklistBtn">
      🔥 Checklist Pro (with Imp %)
    </button>
    <button class="btn btn-secondary" id="openModalBtn">
      🏆 Leaderboard (600+ Students)
    </button>
    <button class="btn btn-secondary" id="openAnalyticsBtn">
      📊 Batch Analytics
    </button>
    <button class="btn btn-secondary" id="openCheatBtn">
      💡 Solutions & Templates
    </button>
    <button class="btn btn-secondary" id="openContestsBtn">
      🏆 Contests & Arena
    </button>
    <button class="btn btn-secondary" id="openNotesBtn">
      📚 Study Notes & PDFs
    </button>
    <button class="btn btn-secondary" id="openGhBtn">
      🐙 GitHub Auto-Sync
    </button>
  </div>

  <div class="footer">
    The Angaar Batch Pro
  </div>
  <script src="popup.js"></script>
</body>
</html>
