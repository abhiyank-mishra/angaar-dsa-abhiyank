<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Angaar Pro</title>
  <style>
    :root {
      --theme-accent: #f97316;
      --theme-accent-hover: #ea580c;
      --theme-accent-subtle: rgba(249, 115, 22, 0.12);
      --theme-accent-border: rgba(249, 115, 22, 0.35);
      --theme-bg: #0a0a0c;
      --theme-surface: #11141d;
      --theme-surface-elevated: #161b26;
      --theme-border: #202637;
      --theme-text: #f8fafc;
      --theme-text-muted: #94a3b8;
      --theme-text-subtle: #64748b;
      --theme-success: #22c55e;
      --theme-success-subtle: rgba(34, 197, 94, 0.12);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 16px;
      width: 250px;
      background: var(--theme-bg);
      color: var(--theme-text);
      font-family: var(--font-sans);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--theme-border);
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--theme-text);
      white-space: nowrap;
      letter-spacing: -0.2px;
    }

    .badge {
      font-size: 10px;
      padding: 2px 6px;
      background: var(--theme-success-subtle);
      color: var(--theme-success);
      border: 1px solid rgba(34, 197, 94, 0.25);
      border-radius: var(--radius-sm);
      font-weight: 500;
      white-space: nowrap;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      text-align: left;
      white-space: nowrap;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      user-select: none;
      box-sizing: border-box;
    }

    .btn-primary {
      background: var(--theme-accent);
      color: #ffffff;
      border-color: var(--theme-accent);
    }

    .btn-primary:hover {
      background: var(--theme-accent-hover);
      border-color: var(--theme-accent-hover);
    }

    .btn-secondary {
      background: var(--theme-surface);
      color: var(--theme-text-muted);
      border-color: var(--theme-border);
    }

    .btn-secondary:hover {
      background: var(--theme-surface-elevated);
      color: var(--theme-text);
      border-color: var(--theme-accent-border);
    }

    .footer {
      margin-top: 14px;
      font-size: 11px;
      color: var(--theme-text-subtle);
      text-align: center;
      border-top: 1px solid var(--theme-border);
      padding-top: 10px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-wrap">
      <h1>Angaar Pro</h1>
    </div>
    <span class="badge">Active</span>
  </div>

  <div class="btn-group">
    <button class="btn btn-primary" id="openModalBtn">
      Leaderboard
    </button>
    <button class="btn btn-secondary" id="openAnalyticsBtn">
      Analytics
    </button>
    <button class="btn btn-secondary" id="openGhBtn">
      GitHub Sync
    </button>
    <button class="btn btn-secondary" id="openCheatBtn">
      Solutions & Templates
    </button>
    <button class="btn btn-secondary" id="openChecklistBtn">
      Export Checklist
    </button>
  </div>

  <div class="footer">
    Angaar Toolkit Pro
  </div>
  <script src="popup.js"></script>
</body>
</html>
